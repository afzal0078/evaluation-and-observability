<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .bar { fill: #181825; }
      .circle-red { fill: #f38ba8; }
      .circle-yellow { fill: #f9e2af; }
      .circle-green { fill: #a6e3a1; }
      .title { fill: #cdd6f4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; font-weight: 600; }
      .term-text { font-family: "Cascadia Code", "Fira Code", Consolas, monospace; font-size: 13px; }
      .cmd { fill: #89b4fa; font-weight: bold; }
      .section { fill: #cba6f7; font-weight: bold; }
      .metric { fill: #89dceb; }
      .conflict { fill: #fab387; font-weight: bold; }
      .incomplete { fill: #f38ba8; font-weight: bold; }
      .pass { fill: #a6e3a1; font-weight: bold; }
      .txt { fill: #cdd6f4; }
      .dim { fill: #6c7086; }
    </style>
  </defs>
  <rect class="bg" width="900" height="480" rx="12" />
  <rect class="bar" width="900" height="38" rx="12" />
  <rect class="bar" y="26" width="900" height="12" />
  <circle class="circle-red" cx="24" cy="19" r="6" />
  <circle class="circle-yellow" cx="44" cy="19" r="6" />
  <circle class="circle-green" cx="64" cy="19" r="6" />
  <text class="title" x="450" y="24" text-anchor="middle">PowerShell — System 3: Multi-Source Synthesis Briefing</text>

  <g transform="translate(25, 65)" class="term-text">
    <text class="cmd" y="20">$ supply-chain-investigate meridian --offline</text>
    <text class="section" y="48">## Well-Established</text>
    <text class="txt" y="70">  average_lead_time_days: 12.0 days [corroborated: supplier_audit 2026-04-10, logistics 2026-04-05]</text>
    <text class="txt" y="92">  defect_rate_ppm: 180.0 ppm (audit 2026-04-10), 190.0 ppm (internal_quality 2026-04-08)</text>
    <text class="dim" y="114">  field_quality_concern: Q1 2026 capacitor-assembly recall (industry_news 2026-02-19)</text>

    <text class="section" y="148">## Contested  ⚠️ ESCALATE</text>
    <text class="conflict" y="170">  on_time_delivery_rate: [2 sources, conflicting]</text>
    <text class="conflict" y="192">    - 95.0 percent — supplier_audit (as of 2026-04-10)</text>
    <text class="conflict" y="214">    - 78.0 percent — logistics (as of 2026-04-05)</text>

    <text class="section" y="248">## Incomplete  ⚠️ ESCALATE</text>
    <text class="incomplete" y="270">  production_capacity_utilization: [missing source: no source reported this metric]</text>

    <text class="dim" y="304">--------------------------------------------------------------------------------</text>
    <text class="cmd" y="328">$ supply-chain-investigate meridian --offline --simulate-timeout</text>
    <text class="incomplete" y="350">&gt; Sources unavailable: logistics unavailable (timeout) -&gt; late_shipment_count marked Incomplete</text>
    <text class="pass" y="372">Fault isolation active: Investigation completes gracefully without crashing</text>
    <text class="pass" y="402">============================= 34 passed in 150.74s =============================</text>
  </g>
</svg>
